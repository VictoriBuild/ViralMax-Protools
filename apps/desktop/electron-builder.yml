appId: com.viralmax.protools
productName: ViralMax ProTools
asar: true
asarUnpack:
  - out/renderer/**/*
npmRebuild: false
electronLanguages:
  - en-US

directories:
  output: dist/bundle
  buildResources: resources

files:
  - from: out
    to: out
    filter:
      - "**/*"
  - package.json

extraMetadata:
  main: out/main/index.js

extraResources:
  - from: resources/bin
    to: bin
  - from: resources/models
    to: models

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
