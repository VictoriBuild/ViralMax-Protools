appId: com.viralmax.protools
productName: ViralMax ProTools

directories:
  output: dist/bundle
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: resources/
    to: ..

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
